name: Android build and tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.1'
      - name: Test
        run: python test_images.py
      - name: Build and verify APK
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: miaomo-debug-apk
          path: build/miaomo-*.apk
